databaseChangeLog:
  - changeSet:
      id: 002-create-accommodations-table
      author: booking-service
      changes:
        - createTable:
            tableName: accommodations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: street
                  type: VARCHAR(255)

              - column:
                  name: city
                  type: VARCHAR(255)

              - column:
                  name: state
                  type: VARCHAR(255)

              - column:
                  name: zip_code
                  type: VARCHAR(50)

              - column:
                  name: country
                  type: VARCHAR(255)

              - column:
                  name: size
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: daily_rate
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: availability
                  type: INTEGER
                  constraints:
                    nullable: false

        - createTable:
            tableName: accommodations_amenities
            columns:
              - column:
                  name: accommodation_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_accommodation_amenities
                    referencedTableName: accommodations
                    referencedColumnNames: id

              - column:
                  name: amenity
                  type: VARCHAR(255)

        - createIndex:
            indexName: idx_accommodations_type
            tableName: accommodations
            columns:
              - column:
                  name: type
