spring:
  application:
    name: booking-service
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
      expiration: ${JWT_EXPIRATION:86400000}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_your_stripe_key}
    public-key: ${STRIPE_PUBLIC_KEY:pk_test_your_stripe_key}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:your_telegram_bot_token}
    chat-id: ${TELEGRAM_CHAT_ID:your_telegram_chat_id}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org/bot}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
